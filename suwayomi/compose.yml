services:
  suwayomi:
    container_name: suwayomi
    image: ghcr.io/suwayomi/tachidesk:preview
    environment:
      - TZ=Etc/UTC
      - DOWNLOAD_AS_CBZ=true
      - EXTENSION_REPOS=["https://raw.githubusercontent.com/keiyoushi/extensions/repo/index.min.json", "https://raw.githubusercontent.com/Suwayomi/tachiyomi-extension/repo/index.min.json"]
    volumes:
      - ${LAB_PATH}/mount/suwayomi:/home/suwayomi/.local/share/Tachidesk
    networks:
      caddy-io:
        ipv4_address: ${IP_SUWAYOMI}
    restart: unless-stopped

networks:
  caddy-io:
    external: true
